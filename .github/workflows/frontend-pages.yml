name: Build and deploy Vue frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        env:
          VITE_BASE_PATH: /Photos/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://your-backend-domain.example/api' }}
        run: npm run build

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="${RUNNER_TEMP}/gh-pages"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${DEPLOY_DIR}" || git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${DEPLOY_DIR}"
          cd "${DEPLOY_DIR}"
          git checkout --orphan gh-pages-new
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${GITHUB_WORKSPACE}/frontend/dist/." .
          touch .nojekyll
          git add -A
          git commit -m "Deploy frontend ${GITHUB_SHA}" || exit 0
          git branch -M gh-pages
          git push -f origin gh-pages
