name: Build and deploy Hugo site

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.161.1
      HUGO_ENVIRONMENT: production
      HUGO_ENV: production
      TZ: Asia/Tokyo
      SITE_URL: https://cx-lgtm.github.io/photography-blog/
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo Extended
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"

      - name: Build with Hugo
        run: hugo --gc --minify --baseURL "${SITE_URL}"

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="${RUNNER_TEMP}/gh-pages"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${DEPLOY_DIR}"
          find "${DEPLOY_DIR}" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R public/. "${DEPLOY_DIR}/"
          touch "${DEPLOY_DIR}/.nojekyll"
          cd "${DEPLOY_DIR}"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}" || exit 0
          git push origin gh-pages
