server:
  port: ${PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:photography_blog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 24MB
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-random-secret-of-at-least-32-characters}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  upload-dir: ${UPLOAD_DIR:uploads}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    display-name: ${ADMIN_DISPLAY_NAME:Site Admin}
